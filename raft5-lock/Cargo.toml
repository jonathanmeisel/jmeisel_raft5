[package]
name = "raft5-lock"
version = "0.1.0"
edition = "2024"

[lib]
name = "raft5_lock"

[dependencies]
raft5-client = { path = "../raft5-client" }
tokio = { workspace = true }
# `CancellationToken` backs `Lock::lost()`. Not a semver-public
# dependency: `lost()` returns `impl Future`, so the token never appears
# in a signature this crate exports.
tokio-util = "0.7.19"
log = "0.4.34"

[dev-dependencies]
raft5-server = { path = "../raft5-server" }
# The test harness calls `env_logger::try_init`. Unlike raft5-client this
# crate has no binary, so initializing a logger is the application's job
# and the dependency is test-only.
env_logger = "0.11.11"
