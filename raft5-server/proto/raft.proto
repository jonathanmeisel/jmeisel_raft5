syntax = "proto3";

package raft5.raft;

import "common.proto";

// The peer API. It runs on a separate port from the client Kv service
// (client.proto), because only other cluster members call it, so it is the
// place to require mutual TLS between members, whatever auth the Kv
// service uses.
service RaftPeer {
  // Chunked, because one log entry can be large: a transaction commits as
  // one entry with every key it wrote, and a unary request would limit a
  // transaction's size to the receiver's decode limit. Chunking moves that
  // limit into `raft`'s own constants, where it is a decision, not a
  // default.
  //
  // Still one request and one response per call: the stream carries one
  // AppendEntries, not a pipeline. The leader's per-peer replication task
  // calls this and feeds the response back to its event loop. An inbound
  // call is answered the same way in every role. The reassembled request is
  // a normal AppendEntriesRequest, so nothing past the gRPC boundary knows
  // it was streamed.
  rpc AppendEntries(stream AppendEntriesChunk) returns (AppendEntriesResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

  // Leader leasing: a separate, light RPC on purpose, not part of
  // AppendEntries, because AppendEntries can be slow (it does real log
  // work) and a lease probe must be fast to detect quorum loss reliably.
  // A follower grants (and refreshes its own lease timer) only if `term`
  // matches its current term. A leader tracks per-peer grants to decide
  // whether it still holds a quorum of leases (which allows serving reads
  // locally, without the log), and a live lease stops a competing election
  // from disrupting a peer's leader (see RequestVoteRequest.dry_run and the
  // follower's lease check).
  rpc GetLease(GetLeaseRequest) returns (GetLeaseResponse);

  // Chunked snapshot transfer, matching the Read/Write streaming of
  // storage::export_snapshot and install_snapshot: the leader sends chunks
  // as the exporter makes them, and the follower feeds each chunk to
  // install_snapshot's reader as it arrives. Neither side holds the whole
  // snapshot in memory.
  rpc InstallSnapshot(stream SnapshotChunk) returns (InstallSnapshotResponse);

  // Who this node is. A leader asks this of a server it is told to add
  // (client.proto's AddServer). Asked here, not on the client API, so it
  // travels over the same mTLS as other peer traffic: a leader always knows
  // how to dial a peer, but a client API's certificate is the operator's
  // business, not the cluster's.
  rpc Identify(IdentifyRequest) returns (IdentifyResponse);
}

message IdentifyRequest {}

// Written out, not a raft5.cluster.ClusterMember: that type is generated
// in raft5-shared, and this file is compiled separately.
message IdentifyResponse {
  string server_id = 1;
  string address = 2;        // peer API, as this node advertises it
  string client_address = 3; // client API, likewise
  // Whether this node already has a configuration. Then it already belongs
  // to a cluster, and adding it to another would make one node a member of
  // two.
  bool in_cluster = 4;
}

// One message of an AppendEntries stream: the header first, then the
// entry payload in as many fragments as needed.
message AppendEntriesChunk {
  oneof part {
    AppendEntriesHeader header = 1; // always the first message on the stream
    bytes entries = 2;              // successive fragments of an EntryBatch
  }
}

// Everything about an AppendEntries except the entries, sent first, so a
// receiver can decide whether it wants the body at all.
message AppendEntriesHeader {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3; // seq
  uint64 prev_log_term = 4;
  uint64 leader_commit = 5; // seq
  uint64 compact_seq = 6;   // see AppendEntriesRequest.compact_seq
  // How many bytes of fragments follow. Advisory: it lets an oversized
  // batch be refused before it is read, but it is the sender's claim, not
  // a fact, so the receiver counts what arrives and enforces its limit on
  // that too.
  uint64 entries_bytes = 7;
}

// What the fragments join into. A separate message because a `repeated`
// field can only be decoded as part of a message.
message EntryBatch {
  repeated raft5.common.LogEntry entries = 1;
}

// The reassembled form of an AppendEntries stream. Never sent as one
// message: `grpc::RaftPeerService` passes it inward once the chunks are
// joined, and every role's event loop sees this form.
message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3; // seq
  uint64 prev_log_term = 4;
  repeated raft5.common.LogEntry entries = 5; // empty = heartbeat
  uint64 leader_commit = 6; // seq
  // The highest seq the leader knows is replicated to every peer (not only
  // a majority). Any node, followers included, may compact its log below
  // this, because nobody will ever need that entry sent again.
  uint64 compact_seq = 7; // seq
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // On success: the highest seq that now matches the leader's log.
  // On failure: hints for the leader to back up prev_log_index faster than
  // one at a time (Raft paper §5.3 optimization), not a match_index.
  uint64 match_index = 3;
  optional uint64 conflict_index = 4;
  optional uint64 conflict_term = 5;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  // Pre-vote (Raft dissertation §9.6): a non-binding "would you grant this?"
  // check. The responder must answer honestly but must not change its own
  // state (current_term, voted_for, election timer). A node can learn
  // whether it could win a real election without raising its term, so a
  // partitioned node that cannot reach a majority does not disrupt a healthy
  // cluster with a raised term when it reconnects.
  bool dry_run = 5;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message GetLeaseRequest {
  string leader_id = 1;
  uint64 term = 2;
  // How long the leader counts this grant toward its read quorum, so the
  // follower promises exactly that, not its own lease length: the two can
  // differ while a heartbeat change replicates. 0 means the follower uses
  // its own lease.
  uint64 lease_millis = 3;
}

message GetLeaseResponse {
  bool lease_granted = 1;
}

message SnapshotChunk {
  oneof part {
    SnapshotHeader header = 1; // always the first message on the stream
    bytes data = 2;            // raw bytes from export_snapshot's writer
  }
}

message SnapshotHeader {
  uint64 term = 1; // leader's current term
  string leader_id = 2;
  uint64 last_included_index = 3; // seq
  uint64 last_included_term = 4;
}

message InstallSnapshotResponse {
  uint64 term = 1; // follower's current term, so a stale leader can step down
}
