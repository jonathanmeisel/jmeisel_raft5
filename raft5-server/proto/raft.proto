syntax = "proto3";

package raft5.raft;

import "common.proto";

// Peer-to-peer API. Served on a separate port from the client-facing Kv
// service (client.proto) -- this one is only ever called by other cluster
// members, so it's the natural place to require mutual TLS / cluster
// membership auth instead of whatever auth the Kv service uses.
service RaftPeer {
  // Chunked, because one log entry can be large: a transaction commits
  // as a single entry carrying every key it wrote, and a unary request
  // would put a hard ceiling on a transaction's size at whatever the
  // receiver's decode limit happens to be. Chunking moves that ceiling
  // into `raft`'s own constants, where it is a decision rather than a
  // default.
  //
  // Still one request and one response per call -- the stream carries
  // one AppendEntries, not a pipeline of them. The leader's per-peer
  // replication task calls this and feeds the single response back into
  // its own event loop; an inbound call is answered the same way
  // regardless of which role this node is currently in. The reassembled
  // request is an ordinary AppendEntriesRequest, so nothing past the
  // gRPC boundary knows this is streamed at all.
  rpc AppendEntries(stream AppendEntriesChunk) returns (AppendEntriesResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

  // Leader leasing: deliberately a separate, lightweight RPC rather than
  // piggybacked on AppendEntries, since AppendEntries can be slow (it does
  // real log-append work) and a lease probe needs to be fast to reliably
  // detect quorum loss. A follower grants (and refreshes its own lease
  // timer) only if `term` matches its current term; a leader tracks
  // per-peer grants to decide whether it still holds a quorum of leases
  // (gates serving reads locally without going through the log) and to
  // avoid disrupting a peer's still-live leader with a competing
  // election (see RequestVoteRequest.dry_run and the follower's lease
  // check).
  rpc GetLease(GetLeaseRequest) returns (GetLeaseResponse);

  // Chunked snapshot transfer. Maps directly onto
  // storage::export_snapshot / install_snapshot's Read/Write-based
  // streaming: the leader reads chunks out of the exporter and sends them
  // as they're produced; the follower feeds each chunk into
  // install_snapshot's reader as it arrives. Neither side ever needs the
  // whole snapshot in memory at once.
  rpc InstallSnapshot(stream SnapshotChunk) returns (InstallSnapshotResponse);

  // Who this node is, asked by a leader about a server it is being told
  // to add (client.proto's AddServer). Asked here rather than on the
  // client API so that it travels over the same mTLS as the rest of the
  // peer traffic: a leader always knows how to dial a peer, but a
  // client API's certificate is the operator's business, not the
  // cluster's.
  rpc Identify(IdentifyRequest) returns (IdentifyResponse);
}

message IdentifyRequest {}

// Spelled out rather than as a raft5.cluster.ClusterMember: that type
// is generated in raft5-shared, and this file is compiled on its own.
message IdentifyResponse {
  string server_id = 1;
  string address = 2;        // peer API, as this node advertises it
  string client_address = 3; // client API, likewise
  // Whether this node already has a configuration -- in which case it
  // belongs to some cluster already, and adding it to another would
  // make one node a member of two.
  bool in_cluster = 4;
}

// One message of an AppendEntries stream: the header first, then the
// entry payload in as many fragments as it takes.
message AppendEntriesChunk {
  oneof part {
    AppendEntriesHeader header = 1; // always the first message on the stream
    bytes entries = 2;              // successive fragments of an EntryBatch
  }
}

// Everything about an AppendEntries except the entries themselves, sent
// before them so a receiver can decide whether it wants the body at all.
message AppendEntriesHeader {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3; // seq
  uint64 prev_log_term = 4;
  uint64 leader_commit = 5; // seq
  uint64 compact_seq = 6;   // see AppendEntriesRequest.compact_seq
  // How many bytes of fragments follow. Advisory -- it lets an oversized
  // batch be refused before it is read, but it is the sender's claim
  // rather than a fact, so a receiver counts what actually arrives and
  // enforces its limit on that too.
  uint64 entries_bytes = 7;
}

// What the fragments concatenate into. A message of its own because a
// `repeated` field can only be decoded as part of one.
message EntryBatch {
  repeated raft5.common.LogEntry entries = 1;
}

// The reassembled form of an AppendEntries stream. Never sent as a
// single message -- it is what `grpc::RaftPeerService` hands inward once
// the chunks are back together, and what every role's event loop still
// sees.
message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3; // seq
  uint64 prev_log_term = 4;
  repeated raft5.common.LogEntry entries = 5; // empty = heartbeat
  uint64 leader_commit = 6; // seq
  // Highest seq the leader knows is replicated to *every* peer (not just a
  // majority) -- safe for any node, follower included, to compact its log
  // below this, since nobody will ever need to be sent that entry again.
  uint64 compact_seq = 7; // seq
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // On success: the highest seq now matching the leader's log.
  // On failure: hints for the leader to back up prev_log_index faster than
  // one-at-a-time (Raft paper §5.3 optimization) rather than a match_index.
  uint64 match_index = 3;
  optional uint64 conflict_index = 4;
  optional uint64 conflict_term = 5;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  // Pre-vote (Raft dissertation §9.6): a non-binding "would you grant
  // this" check. The responder must answer honestly but must not alter
  // any of its own state (current_term, voted_for, election timer) --
  // this lets a node probe whether it could plausibly win a real election
  // without ever bumping its term, so a partitioned node that can't reach
  // a majority doesn't disrupt a healthy cluster by inflating its term
  // once it reconnects.
  bool dry_run = 5;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message GetLeaseRequest {
  string leader_id = 1;
  uint64 term = 2;
}

message GetLeaseResponse {
  bool lease_granted = 1;
}

message SnapshotChunk {
  oneof part {
    SnapshotHeader header = 1; // always the first message on the stream
    bytes data = 2;            // raw bytes from export_snapshot's writer
  }
}

message SnapshotHeader {
  uint64 term = 1; // leader's current term
  string leader_id = 2;
  uint64 last_included_index = 3; // seq
  uint64 last_included_term = 4;
}

message InstallSnapshotResponse {
  uint64 term = 1; // follower's current term, so a stale leader can step down
}
