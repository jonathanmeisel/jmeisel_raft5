syntax = "proto3";

package raft5.common;

// What a log entry does. Only WRITE carries key/value data. The others
// are Raft protocol entries that take a seq (so they take part in log
// matching and commit) but never reach the key/value state in `versions`.
//
// 0 and 1 are not used for real kinds. 0 is proto3's default for a
// missing field: if WRITE were 0, an entry with no kind would decode as a
// write with an empty mutation list, a silent no-op that uses a seq and
// still passes log matching. So 0 is a value that is never sent and always
// rejected.
enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0; // never sent; rejected on receipt
  reserved 1;                 // retired; do not reuse
  NOOP = 2;   // neither `writes` nor `config`; see raft::leader::Leader::new
  // `config` holds an encoded raft5.cluster.ClusterConfig. Unlike the other
  // kinds, it takes effect on append, not on commit: see
  // storage::RaftLog::current_config.
  CONFIG = 3;
  WRITE = 4;  // `writes` non-empty
}

// One key's change in a WRITE entry. An unset `value` is a delete: `log`
// records it as a tombstone, and applying it adds a tombstone row to
// `versions` (see the storage module doc).
message KeyValue {
  bytes key = 1;
  optional bytes value = 2; // unset = delete
}

// Mirrors storage::LogEntry: one entry at a given seq and term. `kind`
// must survive replication: a follower re-appends these into its own log
// exactly, so losing it would turn every replicated entry into a write.
//
// A WRITE carries all of a transaction's mutations, which is what makes
// them commit and apply together: one entry, one seq, one atomic apply to
// `versions`.
message LogEntry {
  uint64 seq = 1;
  uint64 term = 2;
  reserved 3, 4; // retired field numbers; do not reuse
  EntryKind kind = 5;
  repeated KeyValue writes = 6; // kind == WRITE
  optional bytes config = 7;    // kind == CONFIG
}
