[package]
name = "raft5-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "raft5_server"

[dependencies]
raft5-shared = { path = "../raft5-shared" }
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
fjall = "3.1.10"
clap = { version = "4.6.7", features = ["derive"] }
tokio-util = "0.7.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", features = ["trace", "validate-request"] }
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
bytes = "1.12.1"
futures-core = { version = "0.3.34", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
serde_bytes = "0.11.19"
# HS256 only, from a raw shared secret: `rust_crypto` because it needs no C
# toolchain to build, and no `use_pem` because nothing here parses PEM.
# Without exactly one provider feature, signing panics at runtime.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
argon2 = "0.6.0"
http = "1.5.0"
# Invite tokens: 32 bytes from the OS (`getrandom`), stored as their
# SHA-256 (`sha2`) so the log never holds the secret, and spelled in
# URL-safe base64 (`base64`) so a whole token survives being pasted into
# a chat window or a shell.
getrandom = "0.4.3"
sha2 = "0.10.9"
base64 = "0.22.1"

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
rcgen = "0.14.10"
