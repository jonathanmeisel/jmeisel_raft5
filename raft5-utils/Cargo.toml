[package]
name = "raft5-utils"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "local-cluster"
path = "src/bin/local_cluster.rs"

[dependencies]
raft5-server = { path = "../raft5-server" }
raft5-client = { path = "../raft5-client" }
raft5-shared = { path = "../raft5-shared" }
tokio = { workspace = true }
tokio-util = "0.7.19"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Minting the cluster's CA and node certificate at bootstrap. Its default
# features bring the `ring` backend, which is what generates the keys.
rcgen = "0.14.10"
# The JWT secret and the admin password, from the OS.
getrandom = "0.4.3"
base64 = "0.22.1"
