[workspace]
resolver = "3"
members = ["raft5-server", "raft5-shared", "raft5-client", "raft5-utils"]

[workspace.dependencies]
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
