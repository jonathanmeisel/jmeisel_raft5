syntax = "proto3";

package raft5.client;

import "cluster.proto";

// Node-to-client API. Served on a separate port from the peer-to-peer
// RaftPeer service (raft.proto), since the two have different auth/network
// exposure requirements (client access vs. mTLS between known cluster
// members).
service Kv {
  // Write (or delete, if `value` is unset) a single key. Blocks until the
  // entry is committed (and, depending on the desired consistency level,
  // applied) by the current leader.
  rpc Write(WriteRequest) returns (WriteResponse);

  // Read the current value for a key. `linearizable = true` requires a
  // read-index/lease-read round before answering; `false` allows a
  // possibly-stale local read.
  rpc Read(ReadRequest) returns (ReadResponse);

  // Cluster membership changes, one server at a time (single-server
  // change, not joint consensus -- simpler to reason about; joint
  // consensus for atomic multi-member changes can come later if needed).
  rpc AddServer(AddServerRequest) returns (ConfigChangeResponse);
  rpc RemoveServer(RemoveServerRequest) returns (ConfigChangeResponse);

  // Form a single-node cluster around this node (Raft §4.4). Refused by
  // any node that already has a configuration or a non-empty log:
  // bootstrapping twice is how one cluster silently becomes two, each
  // half believing it is the whole. A server meant to *join* an existing
  // cluster is added via AddServer on that cluster's leader instead, and
  // receives its configuration by replication.
  rpc Bootstrap(BootstrapRequest) returns (ConfigChangeResponse);

  // The cluster configuration currently in force on this node -- whatever
  // its own log's tail says (Raft §4.1: on append, not on commit), so it
  // can reflect a change that hasn't finished committing yet. Empty
  // `members` means this node hasn't been bootstrapped or added to a
  // cluster yet. Answered by any node, not just the leader: membership is
  // local, read-only state, unlike a write or a linearizable read.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);

  // Multi-key transactions. A transaction reads and buffers writes
  // across any number of keys and commits them as a single log entry,
  // so they become durable together and apply together.
  //
  // Isolation is two-phase locking held in memory on the leader, which
  // is why every one of these is refused by anyone else: a transaction
  // belongs to the leader that created it and cannot outlive its term.
  // Nothing is written until Commit -- Drop, a lost connection, or the
  // deadline passing all leave the store exactly as it was.
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse);
  rpc BufferWrite(BufferWriteRequest) returns (BufferWriteResponse);
  rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);
  rpc DropTransaction(DropTransactionRequest) returns (DropTransactionResponse);
}

// Carried in every response so a client can find the real leader without a
// separate discovery RPC.
message RaftError {
  oneof kind {
    NotLeader not_leader = 1;
    string unavailable = 2; // e.g. no leader elected yet
    string timeout = 3;
    WriteConflict conflict = 4;
    TransactionAborted aborted = 5;
  }
}

// A transaction that is no longer usable, and why. Every reason but
// IN_DOUBT means nothing was written, so the caller is free to start
// over and replay whatever it was doing.
message TransactionAborted {
  enum Reason {
    // A key was held by someone this transaction was not allowed to
    // displace: an older transaction, one already committing, or a plain
    // Write already in flight. `key` names it.
    LOCK_CONFLICT = 0;
    // Its deadline passed. Its locks are already gone.
    EXPIRED = 1;
    // No such transaction on this node -- never created, or reclaimed
    // long enough ago that even the record of its death is gone.
    UNKNOWN = 2;
    // The leader changed. A transaction's reads were validated against
    // the leader that served them, so it cannot be finished anywhere
    // else.
    LEADER_CHANGED = 3;
    // The commit reached the log and then this node stopped leading, so
    // nothing here can say whether it committed or was rolled back.
    // `seq` is where it went. Unlike every other reason, this one must
    // NOT be retried: replaying a read-modify-write that already applied
    // applies it twice.
    IN_DOUBT = 4;
    // An older transaction took one of this one's keys. Deliberate, and
    // how the oldest transaction is guaranteed to make progress rather
    // than two transactions aborting each other forever.
    WOUNDED = 5;
  }
  Reason reason = 1;
  optional bytes key = 2; // which key, for LOCK_CONFLICT
  optional uint64 seq = 3; // where the entry went, for IN_DOUBT
}

message NotLeader {
  // Best-known leader, if any. Client should retry there.
  optional string leader_hint = 1;
}

// A write whose precondition didn't hold. Nothing was written.
message WriteConflict {
  // What the key is actually at (0 = no value), for a `previous_seq`
  // that simply didn't match. Unset when the conflict was with another
  // write to the same key still in flight: nothing settled can be said
  // about the key until that one lands, and -- unlike a mismatch --
  // re-sending the same request shortly may well succeed.
  optional uint64 actual_seq = 1;
}

message WriteRequest {
  bytes key = 1;
  optional bytes value = 2; // unset = delete
  // The sequence number this key must currently be at for the write to
  // apply, which is what makes a read-modify-write possible: the caller
  // names the version it read, and a write that raced it is refused
  // (with `WriteConflict`) rather than silently overwriting.
  //
  // Unset -- or 0, the value `ReadOk.seq` already carries for a key
  // with no value -- requires that the key currently have no value, so
  // a caller can echo back the seq it read without special-casing a key
  // that wasn't there. Every write carries a precondition; there is no
  // unconditional overwrite.
  optional uint64 previous_seq = 3;
}

message WriteResponse {
  oneof result {
    uint64 seq = 1; // sequence number the write was committed at
    RaftError error = 2;
  }
}

message ReadRequest {
  bytes key = 1;
  bool linearizable = 2;
  // Read as part of this transaction: the key joins its read set and is
  // held against conflicting writes until it finishes, and a key it has
  // already buffered a write for reads back as that write.
  //
  // Requires `linearizable`. A stale read is answered by whichever node
  // received it, and a node that isn't the leader has no transaction by
  // this id and no lock table to protect it -- it would return
  // unprotected data under a transaction's name.
  optional bytes transaction_id = 3;
}

message ReadResponse {
  oneof result {
    ReadOk ok = 1;
    RaftError error = 2;
  }
}

message ReadOk {
  uint64 seq = 1;
  optional bytes value = 2; // unset = key doesn't currently exist
}

message AddServerRequest {
  // The new server's client API address. The leader dials it for its
  // `GetConfig` to learn the rest of what the configuration needs --
  // server_id and peer API address -- straight from the server being
  // added, rather than trusting the caller to supply them correctly.
  string client_address = 1;
}

message RemoveServerRequest {
  string server_id = 1;
}

message BootstrapRequest {
  // Optional guard: if set, the node refuses unless this is its own id.
  // Bootstrapping is irreversible, so it is worth being able to say out
  // loud which node you believe you are talking to.
  string server_id = 1;
}

message ConfigChangeResponse {
  oneof result {
    bool ok = 1;
    RaftError error = 2;
  }
}

message GetConfigRequest {}

message GetConfigResponse {
  raft5.cluster.ClusterMember identity = 1;
  repeated raft5.cluster.ClusterMember members = 2;
}

// `ttl_ms` is how long the transaction may hold its locks. A value past
// what this server is willing to grant is refused rather than quietly
// shortened: a caller told "yes" to a lifetime it will not get would go
// on to act as though it had one.
message CreateTransactionRequest {
  uint64 ttl_ms = 1;
}

message CreateTransactionResponse {
  oneof result {
    bytes transaction_id = 1; // opaque; server-generated
    RaftError error = 2;
  }
}

// Buffer one key's change. Nothing is written: the value is held on the
// leader until Commit, and the key is locked exclusively from here on.
message BufferWriteRequest {
  bytes transaction_id = 1;
  bytes key = 2;
  optional bytes value = 3; // unset = delete
}

message BufferWriteResponse {
  oneof result {
    bool ok = 1;
    RaftError error = 2;
  }
}

message CommitTransactionRequest {
  bytes transaction_id = 1;
}

message CommitTransactionResponse {
  oneof result {
    // The sequence number every key in the transaction was written at --
    // one entry, so one seq for all of them. Zero for a transaction that
    // buffered no writes: there was nothing to append, so there is no
    // sequence number to name.
    uint64 seq = 1;
    RaftError error = 2;
  }
}

// Give up a transaction and release its locks. Idempotent, and content
// with an id it has never heard of: committing and then dropping is the
// ordinary path, and a client shouldn't have to know whether its drop
// raced its own commit.
message DropTransactionRequest {
  bytes transaction_id = 1;
}

message DropTransactionResponse {
  oneof result {
    bool ok = 1;
    RaftError error = 2;
  }
}
