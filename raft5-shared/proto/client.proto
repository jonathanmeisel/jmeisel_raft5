syntax = "proto3";

package raft5.client;

import "cluster.proto";

// The client API. It runs on a separate port from the peer service
// RaftPeer (raft.proto), because the two have different auth and network
// exposure (client access vs. mTLS between known members).
service Kv {
  // Buffer a write (or a delete, if `value` is unset) into a transaction.
  // Nothing is written here: the value waits on the leader until
  // CommitTransaction, which assigns the seq. A transaction is the only way
  // to write, so a caller that writes one key still opens one. See the
  // transaction section below for why.
  rpc Write(WriteRequest) returns (WriteResponse);

  // Read any number of keys, all as of the same moment, at the consistency
  // that `ReadRequest.consistency` asks for: stale by default,
  // linearizable, in a transaction, or as of a snapshot.
  //
  // `versions_only` returns only the seqs and never reads a value, so the
  // cost does not depend on value size. It is the cheap way to ask "has this
  // changed since I last looked?". A full read can answer that only by
  // sending back the whole value for the caller to discard: megabytes on
  // the wire to learn eight bytes.
  rpc Read(ReadRequest) returns (ReadResponse);

  // Walk the keys that have a value now, in order, from `start_key`.
  // Consistency is as for Read: in a transaction every returned key is
  // read-locked, at a snapshot it is the key set as of that snapshot, and
  // otherwise it is a possibly stale local read.
  rpc GetKeys(GetKeysRequest) returns (GetKeysResponse);

  // Save the current seq under `snapshot_id`, so Read and GetKeys can later
  // see the store exactly as it is now, however much it changes after.
  //
  // Members of the `admins` or `backup-operators` group only. A
  // snapshot is a storage commitment, not a read: until it is removed,
  // every key overwritten or deleted after it keeps the version this
  // snapshot sees.
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);

  // Release a snapshot. The versions it kept can be collected, and reads at
  // it start to fail. Members of `admins` or `backup-operators` only. A
  // backup operator may remove any snapshot, not only one it created:
  // snapshots record no owner.
  rpc RemoveSnapshot(RemoveSnapshotRequest) returns (RemoveSnapshotResponse);

  // Every snapshot that exists. The only way to find ids: snapshot records
  // live in the reserved range, which GetKeys hides. Possibly stale, like
  // any read outside a transaction.
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);

  // Stream a backup of this node's key/value state, as of now or as of a
  // snapshot. Members of `admins` or `backup-operators` only. Any node
  // serves it, because a backup is a local read, so backups can run on a
  // follower.
  //
  // What a backup holds:
  // - every key a client wrote, with its newest value at the backup's seq;
  // - accounts (with their password hashes), groups (the built-in ones
  //   included) and ACLs.
  //
  // ACLs do not apply to a backup. Whoever may take one can read every key
  // in the cluster and every password hash, so membership of
  // `backup-operators` is read access to everything.
  //
  // What it leaves out: invitations, snapshots, deleted keys, older
  // versions, the cluster configuration, and the token signing secret.
  //
  // The secret is not part of the store, so a cluster restored from a backup
  // signs tokens with whatever `--jwt-secret-file` it is started with.
  // Tokens from the old cluster keep working only if that is the same
  // secret.
  //
  // A backup of the current state holds a storage snapshot open while it
  // streams, so disk use can grow during a long backup. A backup at a named
  // snapshot reads versions that snapshot already keeps.
  //
  // The stream is a versioned file format, independent of the storage
  // format: write it to a file as it arrives, and give that file to
  // BootstrapFromBackup.
  rpc Backup(BackupRequest) returns (stream BackupChunk);

  // Bootstrap this node, as Bootstrap does, from a backup: the new
  // single-node cluster holds the backup's contents. The first message is
  // the header (the same fields as BootstrapRequest), and the rest carry the
  // backup's bytes in order.
  //
  // Only a node that is in no cluster and holds no data accepts it. Keys keep
  // the seqs they had in the source cluster, and the log continues after
  // them. The backup is checked (record count and checksum) before the node
  // becomes a cluster; a backup that fails the check leaves the node as it
  // was, and the call can be repeated. A node that crashes while it loads a
  // backup refuses every later bootstrap: delete its database directory.
  //
  // Accounts come from the backup, passwords included. The administrator the
  // node was started with is created only if the backup has no account with
  // that username; when it has one, the backed-up password stays. Like
  // Bootstrap, the call needs that startup administrator's token.
  rpc BootstrapFromBackup(stream BootstrapFromBackupChunk) returns (ConfigChangeResponse);

  // Cluster membership changes, one server at a time (single-server change,
  // not joint consensus, because it is simpler to reason about). Atomic
  // multi-member changes are not supported.
  //
  // Administrators only, on a cluster that keeps accounts: these are the
  // most destructive calls on this service, and removing the wrong server
  // can cost the cluster its quorum.
  rpc AddServer(AddServerRequest) returns (ConfigChangeResponse);
  rpc RemoveServer(RemoveServerRequest) returns (ConfigChangeResponse);
  // Change the cluster's heartbeat interval, and every timeout derived from
  // it. Replicated like a membership change, with the same
  // one-change-at-a-time rule. Administrators only, for the same reason: a
  // heartbeat too short for the network leaves the cluster unable to keep a
  // leader.
  rpc SetHeartbeat(SetHeartbeatRequest) returns (ConfigChangeResponse);

  // Form a single-node cluster around this node (Raft §4.4). A node that
  // already has a configuration or a non-empty log refuses: a second
  // bootstrap is how one cluster silently becomes two, each half believing
  // it is the whole. To join an existing cluster, call AddServer on that
  // cluster's leader; the new server gets its configuration by replication.
  rpc Bootstrap(BootstrapRequest) returns (ConfigChangeResponse);

  // The cluster configuration in force on this node: what its own log's
  // tail says (Raft §4.1: on append, not on commit), so it can show a change
  // that has not finished committing. Empty `members` means this node is not
  // yet bootstrapped or added to a cluster.
  //
  // Any node answers, not only the leader: membership is local, read-only
  // state. Its `is_leader` is how a client finds the leader, so this is the
  // one call that is useful to send to a node exactly because you do not
  // know what it is yet.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);

  // Transactions. A transaction reads and buffers writes across any number
  // of keys and commits them as one log entry, so they become durable and
  // apply together.
  //
  // This is the only way to write. Using one mechanism for everything is
  // deliberate: a single-key write is a transaction of one key. That costs
  // one more round trip than a dedicated call, but avoids a second set of
  // locking and failure rules that would have to agree with this one.
  //
  // Isolation is two-phase locking, held in memory on the leader, so every
  // other node refuses these calls: a transaction belongs to the leader that
  // created it and cannot outlive its term. Nothing is written until Commit.
  // Drop, a lost connection, or a passed deadline all leave the store as it
  // was.
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse);
  rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);
  rpc DropTransaction(DropTransactionRequest) returns (DropTransactionResponse);

  // Authentication.
  //
  // Optional: a node started without a signing secret answers these calls
  // with AUTH_DISABLED and asks nobody for a token.
  //
  // When it is on, every other RPC on this service needs a token, with
  // these exceptions: Login, which issues tokens; GetConfig, because a
  // client must find the leader before it can send a login; and
  // RedeemInvite (see below).

  // Exchange a username and password for a token.
  //
  // Only the leader answers. The account is read linearizably, so a user
  // deleted a moment ago cannot log in through a follower that has not
  // heard of the delete. That matters, because a token issued here is valid
  // until it expires.
  //
  // `password` is plaintext in the message. Without TLS on the client API,
  // anyone who can see the traffic can see it.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Add and remove accounts. Admin only. The caller's admin rights (its
  // membership of `admins`) are checked on each call, not taken from the
  // token: a right inside a token could not be withdrawn before the token
  // expired.
  //
  // Deleting an account also takes it out of every group, so a later
  // account with the same name inherits nothing. It is refused for the last
  // member of `admins`.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // Invitations: accounts created by the person who will own them, not by
  // an administrator for them.
  //
  // With CreateUser, an administrator chooses someone else's password,
  // which means knowing it, typing it, and sending it over some channel. An
  // invitation replaces that with a single-use secret: the administrator
  // decides that an account may exist and what rights it gets, the
  // recipient chooses the username and password, and no password is known
  // to two people.
  //
  // An invite is 32 random bytes, given out once by CreateInvite and never
  // recoverable. The cluster keeps only its SHA-256, so a leaked log,
  // snapshot or database directory contains no usable invite. Redeeming an
  // invite uses it up in the same transaction that writes the account, so a
  // token works exactly once, however many callers race to use it.

  // Create an invitation. Administrators only.
  //
  // The administrator sets the new account's rights here; the recipient
  // cannot choose them. An invite whose holder could ask to join `admins`
  // would let anyone promote themselves.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);

  // Use an invitation to create an account.
  //
  // Answered without a token, like Login and GetConfig, by necessity: the
  // caller has no account yet, which is why they hold an invite. The invite
  // is the credential, and it is the only thing between this call and an
  // open cluster.
  //
  // Only the leader answers. `password` is plaintext in the message, as for
  // Login, with the same need for TLS.
  rpc RedeemInvite(RedeemInviteRequest) returns (RedeemInviteResponse);

  // The open invitations, with who issued each and when it lapses. Never
  // the secret, which no longer exists once CreateInvite has answered.
  // Administrators only: an invite names its issuer and may name its
  // intended recipient.
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);

  // Withdraw an invitation that has not been redeemed. Administrators only.
  // This is the fix for one sent to the wrong address: the secret cannot be
  // recalled, only made worthless.
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);

  // Permissions: groups, and access control lists (ACLs) on key prefixes.
  //
  // Optional, even more than authentication. A key that no ACL governs is
  // open to every authenticated caller, so a cluster that writes no ACL
  // restricts nothing. ACLs restrict; they never grant extra access.
  //
  // The ACL on the longest key prefix that has one governs a key. That is
  // the longest prefix with an ACL, not the longest that mentions the
  // caller. An ACL on `app/` that names only alice denies bob `app/config`
  // outright, and does not fall back to a shorter prefix. That makes an ACL
  // a statement about a subtree, and makes revoking access to a subtree
  // possible.
  //
  // `write` includes `read`, and adds creating and deleting keys, and
  // authority over the ACL of that prefix and every longer one.
  //
  // Administrators are outside all of this: a member of `admins` may write
  // everywhere, and no ACL can revoke it. An administrator could rewrite
  // that ACL anyway, and locking one out would only lock out the cluster.
  //
  // Roles are groups. Two are built in and created at bootstrap:
  // - `admins`: the cluster's administrators. Administered by its own
  //   members, and never left with no members.
  // - `backup-operators`: may call Backup, CreateSnapshot and
  //   RemoveSnapshot. A backup ignores ACLs and holds every account's
  //   password hash, so this is read access to the whole cluster. It
  //   gives nothing else. Administered by `admins`.
  // Neither can be created or deleted through CreateGroup or DeleteGroup.
  // Membership is transitive, so whoever administers a group nested in one
  // of them decides who holds that role.
  //
  // A group may name only accounts that exist. Otherwise a role granted to
  // a name nobody holds would pass to whoever created that account next.

  // Create a group. Any authenticated caller may, up to a per-creator quota;
  // the creator becomes its only administrator.
  //
  // Unlike accounts, this is not an administrator's privilege, on purpose.
  // A group is a name for a set of people, useful only when an ACL names
  // it, and only someone who already holds write on a prefix can write its
  // ACL. So creating a group gives its creator nothing new.
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);

  // Delete a group. Its administrators, or a cluster administrator.
  //
  // ACLs that name it are left alone: a grant to a group that no longer
  // exists matches nobody, which is how a dangling reference should fail.
  // Rewriting every ACL that names it would be far more work for the same
  // result.
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);

  // Add and remove members and administrators, in one transaction. The
  // group's administrators, or a cluster administrator.
  //
  // One RPC, not four, because the useful changes are not single edits:
  // handing a group over means adding the new administrator and removing
  // the old one, and that must not land half done. Removals apply after
  // additions, so a call that does both to one principal removes it.
  //
  // A group must always have at least one administrator, and cannot
  // contain itself: a cycle would make "who is in this group" unanswerable.
  // Every account added must exist.
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse);

  // What a group contains and who administers it. Any authenticated caller:
  // a group is a name for a set of people, and nobody could decide whether
  // to grant it anything if they could not look it up.
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);

  // Write the ACL that governs a key prefix, replacing what it held.
  //
  // Requires `write` on that prefix, which, by the longest-prefix rule, is
  // "write on this prefix or on a shorter one that governs it". A cluster
  // administrator may always.
  //
  // It does not accept the default. A key nothing governs is open to
  // everyone, which gives permission to use the key, not authority over who
  // else may. Without this rule, any account could write an ACL on the empty
  // prefix and lock out the cluster. So creating an ACL where no ACL decides
  // is an administrator's act.
  rpc SetAcl(SetAclRequest) returns (SetAclResponse);

  // Remove the ACL on a key prefix, so the next shorter prefix with an ACL
  // governs instead. Same authority as writing it, with the same exception
  // from the other side: a removal that leaves the prefix governed by
  // nothing, and so open to everyone, is an administrator's act.
  rpc DeleteAcl(DeleteAclRequest) returns (DeleteAclResponse);

  // Read the ACLs. Any authenticated caller: they say who may reach which
  // keys, which is no secret from the people they are about, and a caller
  // who could not read them could not tell a refusal from a bug.
  //
  // GetAcl answers about one key or prefix, including which prefix governs
  // it, because that is the question a caller with a refusal has.
  rpc GetAcl(GetAclRequest) returns (GetAclResponse);
  rpc ListAcls(ListAclsRequest) returns (ListAclsResponse);
}

// Sent in every response, so a client can find the real leader with no
// separate discovery RPC.
message RaftError {
  reserved 3, 4; // retired field numbers; do not reuse
  oneof kind {
    NotLeader not_leader = 1;
    string unavailable = 2; // for example, no leader elected yet
    TransactionAborted aborted = 5;
  }
}

// A transaction that can no longer be used, and why. Every reason except
// IN_DOUBT means nothing was written, so the caller may start over and
// replay what it was doing.
message TransactionAborted {
  enum Reason {
    // A key was held by a transaction this one may not displace: an older
    // one, or one already committing. `key` names the key.
    LOCK_CONFLICT = 0;
    // Its deadline passed. Its locks are already released.
    EXPIRED = 1;
    // No such transaction on this node: never created, or its record is
    // already reclaimed.
    UNKNOWN = 2;
    // The leader changed. The transaction's reads were checked against the
    // old leader, so it cannot finish anywhere else.
    LEADER_CHANGED = 3;
    // The commit reached the log, and then this node stopped leading, so
    // nobody here can say if it committed or was rolled back. `seq` is where
    // it went. Unlike every other reason, do NOT retry this one: replaying a
    // read-modify-write that already applied applies it twice.
    IN_DOUBT = 4;
    // An older transaction took one of this one's keys. On purpose: it
    // guarantees the oldest transaction makes progress, instead of two
    // transactions aborting each other forever.
    WOUNDED = 5;
  }
  Reason reason = 1;
  optional bytes key = 2; // the contended key, for LOCK_CONFLICT
  optional uint64 seq = 3; // where the entry went, for IN_DOUBT
}

message NotLeader {
  // The best-known leader, if any. The client should retry there.
  optional string leader_hint = 1;
}

// Buffer one key's change into a transaction. Nothing is written: the
// value waits on the leader until CommitTransaction, and the key is
// locked exclusively from now on.
message WriteRequest {
  bytes transaction_id = 1;
  bytes key = 2;
  optional bytes value = 3; // unset = delete
}

message WriteResponse {
  oneof result {
    // Buffered. There is no seq yet: nothing was appended, and
    // CommitTransaction assigns one seq to every key in the transaction.
    bool ok = 1;
    RaftError error = 2;
    // An ACL governs this key and does not grant the caller `write`. Raised
    // when the key is buffered, not at commit: the caller learns about the key
    // it named, when it named it, and does not lose a whole transaction later
    // to an error that cannot say which key caused it.
    AuthError auth_error = 3;
  }
}

message ReadRequest {
  // The keys to read. Answered by position: `ReadOk.entries[i]` answers
  // `keys[i]`, so a key may appear more than once and is answered at each
  // position. At most `MAX_KEYS_PER_READ` (1024). More is refused, not
  // shortened, because the caller chose the number.
  //
  // The whole call is refused if any key is reserved, or if an ACL denies
  // this caller `read` on any key. No partial answer is possible: a
  // positional response cannot leave out a key without saying which, and
  // saying which is the refusal.
  repeated bytes keys = 1;

  // Return only the seqs. No value is read from storage at all, so the cost
  // does not depend on value size, and the response is never cut short.
  bool versions_only = 2;

  // What the caller wants guaranteed. Every mode reads all `keys` as of one
  // moment, `ReadOk.as_of`. The modes differ in what that moment is and in
  // what happens after.
  //
  // Unset means a possibly stale read: the receiving node answers from
  // local state, with no check that it still leads. This is the cheapest
  // call on this service, and the default because most reads can accept it.
  oneof consistency {
    // Read as part of this transaction: every key joins its read set and is
    // held against conflicting writes until it ends, and a key it already
    // wrote reads back as that write. Only the transaction's own leader
    // serves it.
    //
    // Every key named is locked before any is read, including keys that a
    // shortened response leaves out, so a reissue for the rest sees exactly
    // what this call would have.
    bytes transaction_id = 3;

    // Linearizable, with no transaction and no lock. The answering node
    // proves it still leads and holds a read quorum, so the answer includes
    // everything committed anywhere in the cluster at the moment it was
    // given. Nothing is held after, so the keys may change before the caller
    // acts. A caller that needs the keys to stay as read wants a transaction.
    Linearizable linearizable = 4;

    // Read as of the snapshot with this id: what the keys held at the
    // snapshot's seq, whatever happened since, including deletes.
    //
    // Stale like an unset `consistency`, and more so: it describes a past
    // moment on purpose, so any node can serve it without proving it leads.
    // An id the node does not know is refused, not answered as empty. On a
    // node that has not yet applied the CreateSnapshot entry, that is a
    // temporary condition reported like a permanent one: the same staleness as
    // a read of a key just written.
    bytes snapshot_id = 5;
  }
}

// A marker. A message, not a bool, so that "linearizable: false" (a
// present field that asks for no guarantee) cannot be expressed.
message Linearizable {}

message ReadResponse {
  oneof result {
    ReadOk ok = 1;
    RaftError error = 2;
    // An ACL governs one of the keys and does not grant the caller `read`;
    // `detail` says which key, by position. Refused, not answered as absent,
    // for the same reason as a reserved key: "there is nothing here" is also
    // information, and so is "this key changed at seq N", which is why
    // `versions_only` is refused too.
    AuthError auth_error = 3;
  }
}

message ReadOk {
  // The seq that every entry was read as of: each entry is what its key held
  // after every entry up to and including `as_of` was applied, and nothing
  // after.
  //
  // Unset or linearizable: the point this node had applied to when it
  // answered. A stale reader can compare it with the seq its own last
  // commit returned. A lower value means this node has not applied that
  // write yet, and asking another node (or asking again) gives
  // read-your-writes without the cost of a linearizable read.
  //
  // At a snapshot: the snapshot's seq.
  //
  // In a transaction: committed state as of this point, with the
  // transaction's own buffered writes on top. All the keys are locked, so
  // this stays true until the transaction ends.
  uint64 as_of = 1;

  // One entry per key, in the order of `keys`.
  //
  // There may be fewer: when the values in a response would pass
  // `MAX_READ_VALUE_BYTES` (10 MiB), the response stops, and `entries` is a
  // prefix of `keys`. The caller reissues for `keys[entries.len()..]`. There
  // is always at least one entry (no writable value is larger than the
  // budget), so every call makes progress.
  //
  // A reissue is a new read with its own `as_of`. In a transaction or at a
  // snapshot that makes no difference: the keys are locked, or the moment is
  // fixed, so both halves describe the same state. Unset or linearizable, it
  // does: the halves are two moments, and comparing their `as_of` values
  // shows whether anything was applied in between.
  //
  // No `has_more` field: a positional prefix already says exactly which
  // keys are missing.
  repeated KeyVersion entries = 2;
}

message KeyVersion {
  // The seq the key's value was written at, or 0 if it had no value (never
  // written, or deleted: the same here). Seqs start at 1, so 0 is free for
  // this.
  //
  // Always committed state. A key the transaction wrote reads back with its
  // buffered value and the seq of the value it replaces: a buffered write
  // gets a seq only at commit, so there is no other honest answer.
  uint64 seq = 1;

  // Unset when the key has no value, and always unset for a `versions_only`
  // read.
  optional bytes value = 2;
}

message GetKeysRequest {
  // Where to start, inclusive. Empty starts at the first key. A caller that
  // continues a walk should use `GetKeysOk.next_start_key`.
  bytes start_key = 1;
  // The most keys to return. 0 means the server's default (10). A request
  // for more than the server scans in one call is refused, not shortened,
  // as for transaction lifetimes: a caller told "yes" would page as if it
  // had a batch size it did not get.
  uint32 max_keys = 2;
  // What the caller wants guaranteed, as in ReadRequest. Unset is a
  // possibly stale read on the same terms.
  oneof consistency {
    // Walk as part of this transaction: every returned key joins its read
    // set, as with Read, and the transaction's buffered writes are included
    // (a buffered write makes a key appear, a buffered delete makes it
    // disappear).
    //
    // What this does and does not promise: every returned key is locked, so
    // none can change while the transaction lives. The range is not locked.
    // These are per-key locks, not predicate locks, so someone else can still
    // create a key at a position the walk already passed. A transaction that
    // must not miss such a key cannot get that guarantee here.
    bytes transaction_id = 3;

    // Walk the keys that had a value as of this snapshot, including keys
    // deleted since and excluding keys created since.
    bytes snapshot_id = 4;

    // Include everything committed anywhere in the cluster, as for Read.
    // Each call is its own moment: a walk of several calls is linearizable
    // per batch, not as a whole. A walk that must see one moment uses a
    // snapshot or a transaction.
    Linearizable linearizable = 5;
  }
}

message GetKeysResponse {
  oneof result {
    GetKeysOk ok = 1;
    RaftError error = 2;
    // No auth_error, on purpose, though every returned key is checked. Keys
    // the caller may not read are left out instead of refusing the walk: a
    // scan asks about a range, not a key, and "some of this is not for you"
    // would say more than returning what is. It is also the only answer that
    // composes: a caller whose access is one subtree of a large store can
    // still walk the store.
  }
}

message Snapshot {
  bytes snapshot_id = 1;
  // The seq this snapshot reads at.
  //
  // Not stored in the record: it is the seq of the record's own write. That
  // is why a snapshot is created once and never updated: a second write
  // would move it forward in time.
  uint64 seq = 2;
  // When the creating client said it created it. For humans reading a
  // listing; nothing depends on it, and nothing should: it is one client's
  // clock, stored as given.
  uint64 created_unix_ms = 3;
}

message CreateSnapshotRequest {
  // Chosen by the caller, and unique: creating one that already exists is
  // refused, not used to move it. Same character set as a username (plus
  // `:` and `+`), for the same reason: it is appended to a fixed key prefix
  // with no separator.
  bytes snapshot_id = 1;
  uint64 created_unix_ms = 2;
}

message CreateSnapshotResponse {
  oneof result {
    Snapshot ok = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message RemoveSnapshotRequest {
  bytes snapshot_id = 1;
}

message RemoveSnapshotResponse {
  oneof result {
    // The seq the removal landed at.
    uint64 seq = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message ListSnapshotsRequest {}

message SnapshotList {
  repeated Snapshot snapshots = 1;
}

message ListSnapshotsResponse {
  oneof result {
    SnapshotList ok = 1;
    RaftError error = 2;
  }
}

message GetKeysOk {
  // In ascending order, at or after `start_key`. Only keys with a value
  // now: a deleted key is not here.
  repeated bytes keys = 1;
  // Whether more keys may follow. Sent explicitly, not inferred from
  // `keys.len() < max_keys`: buffered deletes and ACL filtering can shorten
  // a batch that is not the last one.
  bool has_more = 2;
  // Where the next batch starts. Set whenever `has_more` is set. Use it;
  // do not compute a cursor from the last key.
  //
  // The last key plus a zero byte is the right next start only when the
  // batch filled. A scan can also stop because it examined as many keys as
  // the server looks at in one call, which keeps a walk bounded when most
  // keys it passes are filtered out (by an ACL or buffered deletes). Such a
  // batch can be short or empty while many keys remain, with no last key to
  // derive a cursor from, so the server sends the key where it stopped.
  //
  // A server that does not send this stops only when the batch fills, so a
  // client that uses this field when present, and the zero-byte rule
  // otherwise, works with both.
  bytes next_start_key = 3;
}

message BackupRequest {
  // The snapshot to back up at. Empty backs up the current state.
  bytes snapshot_id = 1;
}

message BackupChunk {
  oneof result {
    // The next bytes of the backup file.
    bytes data = 1;
    // The caller is not an administrator. Sent as the only message.
    AuthError auth_error = 2;
  }
}

message BootstrapFromBackupChunk {
  oneof part {
    // First, and only first.
    BootstrapRequest header = 1;
    // The backup file's bytes, in order, after the header.
    bytes data = 2;
  }
}

message AddServerRequest {
  // Retired field; do not reuse.
  reserved 1;
  reserved "client_address";
  // The new server's peer API address. The leader asks the new server
  // itself (RaftPeer's `Identify`, over the peer mTLS it already uses) for
  // the rest of what the configuration needs, server_id and client API
  // address, instead of trusting the caller to supply them correctly.
  string peer_address = 2;
}

message RemoveServerRequest {
  string server_id = 1;
}

message SetHeartbeatRequest {
  // 10 to 10000. Should be well above the round trip between any two
  // servers: votes and lease probes time out after two heartbeats.
  uint64 heartbeat_millis = 1;
}

message BootstrapRequest {
  // Optional guard: if set, the node refuses unless this is its own id.
  // Bootstrap cannot be undone, so it is worth stating which node you think
  // you are talking to.
  string server_id = 1;
  // The new cluster's heartbeat interval; 0 means the default (50 ms).
  // SetHeartbeat can change it later.
  uint64 heartbeat_millis = 2;
}

message ConfigChangeResponse {
  oneof result {
    bool ok = 1;
    RaftError error = 2;
    // Membership changes are admin only, so this carries the same NOT_ADMIN
    // as CreateUser: one error type for "you may not do this", whatever the
    // call.
    AuthError auth_error = 3;
  }
}

message GetConfigRequest {}

message GetConfigResponse {
  raft5.cluster.ClusterMember identity = 1;
  repeated raft5.cluster.ClusterMember members = 2;
  // Whether this node leads right now: it has applied the no-op from its own
  // term (so its state includes everything earlier leaders committed), and
  // it still holds a quorum of leases (so it has not lost leadership without
  // noticing). A leader that fails either check says false, like a
  // follower. That includes, briefly, a leader that just won an election and
  // has not applied its no-op. This is reported, not waited for, so a client
  // looking for the leader is never held up by a node that is not ready; it
  // looks again.
  //
  // This is how a client finds the leader. It is on GetConfig, not a
  // separate probe, because a client looking for the leader wants each
  // node's membership anyway: a client seeded with one follower learns
  // where the others are from the same answer that says this node is not
  // the leader.
  bool is_leader = 3;
  // The heartbeat interval this node runs at, from the same configuration as
  // `members`. 0 from a node with no configuration yet.
  uint64 heartbeat_millis = 4;
}

// `ttl_ms` is how long the transaction may hold its locks. A value past
// what the server allows is refused, not shortened: a caller told "yes"
// to a lifetime it will not get would act as if it had it.
message CreateTransactionRequest {
  uint64 ttl_ms = 1;
}

message CreateTransactionResponse {
  oneof result {
    bytes transaction_id = 1; // opaque; server-generated
    RaftError error = 2;
  }
}

message CommitTransactionRequest {
  bytes transaction_id = 1;
}

message CommitTransactionResponse {
  oneof result {
    // The seq every key in the transaction was written at: one entry, one
    // seq. Zero for a transaction that buffered no writes: nothing was
    // appended, so there is no seq.
    uint64 seq = 1;
    RaftError error = 2;
  }
}

// Give up a transaction and release its locks. Safe to repeat, and fine
// with an unknown id: commit-then-drop is the normal path, and a client
// should not need to know whether its drop raced its own commit.
message DropTransactionRequest {
  bytes transaction_id = 1;
}

message DropTransactionResponse {
  oneof result {
    bool ok = 1;
    RaftError error = 2;
  }
}

// Why an authenticated request was not served. A bad token is a different
// case, and never reaches these RPCs.
//
// Sent in band next to RaftError, not as a gRPC status, like a lock
// conflict: these are answers, not failures to answer, and a client that
// retried them would spend its whole deadline getting the same answer. An
// UNAUTHENTICATED status means one thing only (the token was missing,
// forged, or expired), and the node's auth layer raises it before any
// handler runs.
message AuthError {
  enum Kind {
    UNSPECIFIED = 0;
    // The username or the password was wrong. Which one is not said, on
    // purpose: naming the username as the valid half gives away half a
    // credential.
    BAD_CREDENTIALS = 1;
    ALREADY_EXISTS = 2;
    NO_SUCH_USER = 3;
    // The caller is who they say they are, and is not an admin.
    NOT_ADMIN = 4;
    // This node was started without a signing secret, so it has no accounts
    // to check and nothing to sign a token with.
    AUTH_DISABLED = 5;
    // The invitation cannot be used: unknown, already redeemed, revoked,
    // lapsed, or issued for another username. The `kind` does not say which,
    // on purpose. `detail` says more, for a human, but a client has one fix
    // for all: ask the issuer for another.
    BAD_INVITE = 6;
    // An ACL governs this key or prefix and does not grant the caller what
    // the call needs. It does not say which ACL or what it grants: GetAcl
    // answers that, for a caller who may ask.
    NOT_PERMITTED = 7;
    // No such group. Separate from NO_SUCH_USER because the namespaces are
    // separate: a caller told "no such user" about a group name would look for
    // an account.
    NO_SUCH_GROUP = 8;
    // No ACL on that exact prefix. Only DeleteAcl raises it. A longer or
    // shorter prefix may have one, which is why this does not mean "no ACL
    // applies here".
    NO_SUCH_ACL = 9;
  }
  Kind kind = 1;
  string detail = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginOk {
  string token = 1;
  // When the token stops being accepted, in seconds since the epoch. Sent
  // explicitly, so a client never has to parse a JWT to know when to log in
  // again.
  int64 expires_unix = 2;
}

message LoginResponse {
  oneof result {
    LoginOk ok = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  // Whether the account joins the `admins` group, in the same transaction.
  bool is_admin = 3;
}

message CreateUserResponse {
  oneof result {
    // The seq the account record was written at.
    uint64 seq = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message DeleteUserRequest {
  string username = 1;
}

message DeleteUserResponse {
  oneof result {
    uint64 seq = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message CreateInviteRequest {
  // Whether the account this invite creates joins the `admins` group. The
  // issuer's choice, never the recipient's.
  bool is_admin = 1;
  // How long the invite can be used, from when the leader writes it. 0
  // means the server's default (24 hours). A value longer than the server
  // allows is refused, not shortened, for the reason given in
  // CreateTransactionRequest.ttl_ms.
  uint64 ttl_ms = 2;
  // If set, the only username this invite may create: an invite meant for
  // one person, not for whoever holds it. It does not make the invite less
  // secret; it stops a misdelivered one from becoming an account with an
  // unexpected name.
  optional string username = 3;
}

// An invitation as everyone but its recipient sees it: everything except
// the secret.
message Invite {
  // The SHA-256 of the token, in URL-safe base64. Derived, not stored with
  // the secret, so it is a name that can be written down, listed and used to
  // revoke, without being worth anything to whoever reads it.
  string invite_id = 1;
  // The administrator who issued it.
  string issued_by = 2;
  bool is_admin = 3;
  // The username it is pinned to, if any.
  optional string username = 4;
  // When it can no longer be redeemed, by the leader's clock. That is the
  // only clock involved: neither the issuer's nor the recipient's clock can
  // be trusted to limit a credential.
  uint64 expires_unix_ms = 5;
}

message CreateInviteOk {
  // The secret. This is the only time it is sent. The cluster keeps its
  // hash, so an issuer who loses this cannot recover it and must revoke the
  // invite and create another.
  string token = 1;
  Invite invite = 2;
  // The seq the invite record was written at.
  uint64 seq = 3;
}

message CreateInviteResponse {
  oneof result {
    CreateInviteOk ok = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message RedeemInviteRequest {
  // The secret, exactly as CreateInvite gave it out.
  string token = 1;
  // The account to create. The recipient chooses it, unless the invite
  // pins one, with the same character set as every username.
  string username = 2;
  string password = 3;
}

message RedeemInviteOk {
  // The seq the account record was written at. The invite's removal landed
  // at the same seq: they are one transaction, which is what makes an invite
  // single-use.
  uint64 seq = 1;
}

message RedeemInviteResponse {
  oneof result {
    RedeemInviteOk ok = 1;
    RaftError error = 2;
    // ALREADY_EXISTS here means the username is taken, and the invite was
    // not used up: the caller may try another name with the same token.
    AuthError auth_error = 3;
  }
}

message ListInvitesRequest {}

message InviteList {
  // In id order, which is hash order, which is no meaningful order: there
  // is nothing to sort invites by that each one does not already show.
  repeated Invite invites = 1;
}

message ListInvitesResponse {
  oneof result {
    InviteList ok = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message RevokeInviteRequest {
  // As `Invite.invite_id` gives it, not the token.
  string invite_id = 1;
}

message RevokeInviteResponse {
  oneof result {
    // The seq the removal landed at.
    uint64 seq = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

// Something a group or an ACL can name.
//
// A oneof, not a name plus a kind enum, so a request cannot contain "a
// principal with no kind". Users and groups are separate namespaces:
// `user:ops` and `group:ops` are two different principals, and neither
// resolves to the other.
message Principal {
  oneof kind {
    string user = 1;
    string group = 2;
  }
}

// What a principal may do with the keys an ACL governs.
//
// RIGHT_UNSPECIFIED is the proto3 default, so a grant with the right left
// unset is an error, not the lowest-numbered right. Requests are refused
// unless they name RIGHT_READ or RIGHT_WRITE explicitly.
enum Right {
  RIGHT_UNSPECIFIED = 0;
  // Read the keys under this prefix, and nothing else.
  RIGHT_READ = 1;
  // Read, write, create and delete them, and set the ACL of this prefix and
  // of any longer one.
  RIGHT_WRITE = 2;
}

message AclEntry {
  Principal principal = 1;
  Right right = 2;
}

// One access control list: the key prefix it governs and what it grants.
message Acl {
  // The prefix, exactly as set. The empty prefix governs every key.
  bytes prefix = 1;
  repeated AclEntry entries = 2;
  // The seq the record was written at.
  uint64 seq = 3;
}

message CreateGroupRequest {
  // Same character set as a username, for the same reason: it is appended
  // to a fixed key prefix with no separator. A separate namespace from
  // usernames, though: a group may share a name with an account without
  // being it.
  string name = 1;
  // Optional initial contents, applied in the transaction that creates the
  // group. The creator is always one of its administrators, whatever these
  // say, so a group can never start with no administrator.
  repeated Principal members = 2;
  repeated Principal admins = 3;
}

message CreateGroupResponse {
  oneof result {
    uint64 seq = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message DeleteGroupRequest {
  string name = 1;
}

message DeleteGroupResponse {
  oneof result {
    uint64 seq = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message UpdateGroupRequest {
  string name = 1;
  // Additions first, then removals, so a principal named in both ends up
  // removed. That order makes "replace these members with those" one call
  // with only one meaning.
  repeated Principal add_members = 2;
  repeated Principal remove_members = 3;
  repeated Principal add_admins = 4;
  repeated Principal remove_admins = 5;
}

message UpdateGroupResponse {
  oneof result {
    uint64 seq = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message Group {
  string name = 1;
  // The account that created it. Stored so a listing can say where a group
  // came from. Only the per-creator quota depends on it, and the group's
  // administrators need not include this account.
  string created_by = 2;
  // Who may change the group. Separate from its members, and not
  // implicitly members: administering a group means deciding who is in it,
  // and being in it means holding what it was granted. An administrator who
  // wants the group's access adds themselves as a member, which they may.
  repeated Principal admins = 3;
  repeated Principal members = 4;
  // The seq the record was last written at.
  uint64 seq = 5;
}

message GetGroupRequest {
  string name = 1;
}

message GetGroupResponse {
  oneof result {
    Group ok = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message ListGroupsRequest {}

message GroupList {
  // In name order, with members and admins as stored, not expanded. A
  // nested group appears as itself, because the nesting is what someone
  // reading a listing needs to see.
  repeated Group groups = 1;
}

message ListGroupsResponse {
  oneof result {
    GroupList ok = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message SetAclRequest {
  // The key prefix to govern. Empty is valid and governs everything.
  bytes prefix = 1;
  // Replaces what the prefix held; does not merge. A caller that read an
  // ACL, decided what it should say, and sends that, writes what it meant.
  // A merge could not express that: there would be no way to remove an
  // entry.
  //
  // A principal may appear at most once.
  repeated AclEntry entries = 2;
}

message SetAclResponse {
  oneof result {
    uint64 seq = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message DeleteAclRequest {
  bytes prefix = 1;
}

message DeleteAclResponse {
  oneof result {
    uint64 seq = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message GetAclRequest {
  // A key or a prefix: the same thing here. The answer is about whichever
  // ACL governs it.
  bytes key = 1;
}

message GetAclOk {
  // The ACL that governs `key`, absent if none does. Then the key is open
  // to every authenticated caller.
  optional Acl acl = 1;
  // What that ACL grants the caller, absent when nothing governs the key.
  // Answered here so "may I write this?" is one round trip, not a client
  // reimplementing group expansion.
  optional Right effective = 2;
}

message GetAclResponse {
  oneof result {
    GetAclOk ok = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message ListAclsRequest {}

message AclList {
  // In prefix order, shortest first where one is a prefix of another: the
  // order they take effect, least specific to most.
  repeated Acl acls = 1;
}

message ListAclsResponse {
  oneof result {
    AclList ok = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}
