syntax = "proto3";

package raft5.client;

import "cluster.proto";

// Node-to-client API. Served on a separate port from the peer-to-peer
// RaftPeer service (raft.proto), since the two have different auth/network
// exposure requirements (client access vs. mTLS between known cluster
// members).
service Kv {
  // Buffer a write (or a delete, if `value` is unset) into a transaction.
  // Nothing is written here: the value is held on the leader until
  // CommitTransaction, which is where a sequence number comes from. A
  // transaction is the only way to write, so a caller writing one key
  // still opens one -- see the transaction block below for why that is
  // the whole protocol rather than a special case of it.
  rpc Write(WriteRequest) returns (WriteResponse);

  // Read the current value for a key. Inside a transaction
  // (`transaction_id` set) the read is linearizable and takes a lock;
  // outside one it is a possibly-stale local read, served by whichever
  // node received it.
  rpc Read(ReadRequest) returns (ReadResponse);

  // Walk the keys that currently have a value, in order, starting at
  // `start_key`. Consistency follows Read exactly: inside a transaction
  // every key handed back is read-locked, outside one it is a
  // possibly-stale local read.
  rpc GetKeys(GetKeysRequest) returns (GetKeysResponse);

  // Cluster membership changes, one server at a time (single-server
  // change, not joint consensus -- simpler to reason about; joint
  // consensus for atomic multi-member changes can come later if needed).
  //
  // Administrators only, on a cluster that keeps accounts: these are the
  // most destructive calls this service has, and removing the wrong
  // server can cost a cluster its quorum.
  rpc AddServer(AddServerRequest) returns (ConfigChangeResponse);
  rpc RemoveServer(RemoveServerRequest) returns (ConfigChangeResponse);

  // Form a single-node cluster around this node (Raft §4.4). Refused by
  // any node that already has a configuration or a non-empty log:
  // bootstrapping twice is how one cluster silently becomes two, each
  // half believing it is the whole. A server meant to *join* an existing
  // cluster is added via AddServer on that cluster's leader instead, and
  // receives its configuration by replication.
  rpc Bootstrap(BootstrapRequest) returns (ConfigChangeResponse);

  // The cluster configuration currently in force on this node -- whatever
  // its own log's tail says (Raft §4.1: on append, not on commit), so it
  // can reflect a change that hasn't finished committing yet. Empty
  // `members` means this node hasn't been bootstrapped or added to a
  // cluster yet. Answered by any node, not just the leader: membership is
  // local, read-only state, unlike a write or a transactional read. Its
  // `is_leader` is also how a client finds the leader in the first
  // place, so this is the one call that is useful to send to a node
  // precisely because you don't yet know what it is.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);

  // Transactions. A transaction reads and buffers writes across any
  // number of keys and commits them as a single log entry, so they
  // become durable together and apply together.
  //
  // This is the only way to write, and the only way to read something
  // guaranteed current. Collapsing both onto one mechanism is
  // deliberate: a single-key write is a transaction of one key, which
  // costs a round trip more than a dedicated call would and saves a
  // second set of locking and failure rules that would have to agree
  // with this one.
  //
  // Isolation is two-phase locking held in memory on the leader, which
  // is why every one of these is refused by anyone else: a transaction
  // belongs to the leader that created it and cannot outlive its term.
  // Nothing is written until Commit -- Drop, a lost connection, or the
  // deadline passing all leave the store exactly as it was.
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse);
  rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);
  rpc DropTransaction(DropTransactionRequest) returns (DropTransactionResponse);

  // Authentication.
  //
  // Opt-in: a node started without a signing secret answers all three of
  // these with AUTH_DISABLED and demands a token from nobody, which is
  // the cluster exactly as it behaved before any of this existed.
  //
  // When it is on, every other RPC on this service needs a token. The
  // two exceptions are below and above: Login, which is what issues one,
  // and GetConfig, because a client has to be able to find the leader
  // before it has anywhere to send a login.

  // Exchange a username and password for a token.
  //
  // Answered only by the leader. The account is read linearizably, so a
  // user deleted a moment ago cannot still log in by reaching a follower
  // that hasn't heard about it -- the failure worth preventing, since a
  // token handed out here is good until it expires.
  //
  // `password` is plaintext on the wire. Until this API is behind TLS,
  // anyone who can see the traffic can see it.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Add and remove accounts. Admin only, and the caller's admin rights
  // are re-read from the store on each call rather than taken from the
  // token -- a right baked into a token could not be taken back before
  // that token expired.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

// Carried in every response so a client can find the real leader without a
// separate discovery RPC.
message RaftError {
  reserved 3, 4; // a never-constructed `timeout`, and a write precondition
  oneof kind {
    NotLeader not_leader = 1;
    string unavailable = 2; // e.g. no leader elected yet
    TransactionAborted aborted = 5;
  }
}

// A transaction that is no longer usable, and why. Every reason but
// IN_DOUBT means nothing was written, so the caller is free to start
// over and replay whatever it was doing.
message TransactionAborted {
  enum Reason {
    // A key was held by someone this transaction was not allowed to
    // displace: an older transaction, or one already committing. `key`
    // names it.
    LOCK_CONFLICT = 0;
    // Its deadline passed. Its locks are already gone.
    EXPIRED = 1;
    // No such transaction on this node -- never created, or reclaimed
    // long enough ago that even the record of its death is gone.
    UNKNOWN = 2;
    // The leader changed. A transaction's reads were validated against
    // the leader that served them, so it cannot be finished anywhere
    // else.
    LEADER_CHANGED = 3;
    // The commit reached the log and then this node stopped leading, so
    // nothing here can say whether it committed or was rolled back.
    // `seq` is where it went. Unlike every other reason, this one must
    // NOT be retried: replaying a read-modify-write that already applied
    // applies it twice.
    IN_DOUBT = 4;
    // An older transaction took one of this one's keys. Deliberate, and
    // how the oldest transaction is guaranteed to make progress rather
    // than two transactions aborting each other forever.
    WOUNDED = 5;
  }
  Reason reason = 1;
  optional bytes key = 2; // which key, for LOCK_CONFLICT
  optional uint64 seq = 3; // where the entry went, for IN_DOUBT
}

message NotLeader {
  // Best-known leader, if any. Client should retry there.
  optional string leader_hint = 1;
}

// Buffer one key's change into a transaction. Nothing is written: the
// value is held on the leader until CommitTransaction, and the key is
// locked exclusively from here on.
message WriteRequest {
  bytes transaction_id = 1;
  bytes key = 2;
  optional bytes value = 3; // unset = delete
}

message WriteResponse {
  oneof result {
    // Buffered. There is no sequence number to give: nothing has been
    // appended, and CommitTransaction is what assigns one -- to every
    // key in the transaction at once.
    bool ok = 1;
    RaftError error = 2;
  }
}

message ReadRequest {
  reserved 2; // a `linearizable` flag; `transaction_id` now says it
  bytes key = 1;
  // Read as part of this transaction: the key joins its read set and is
  // held against conflicting writes until it finishes, and a key it has
  // already buffered a write for reads back as that write. Such a read
  // is linearizable, and only the transaction's own leader will serve
  // it.
  //
  // Unset is a possibly-stale read, answered from local state by
  // whichever node received it, with no check that it still leads. That
  // is the whole difference: linearizability comes from being in a
  // transaction, not from a flag.
  optional bytes transaction_id = 3;
}

message ReadResponse {
  oneof result {
    ReadOk ok = 1;
    RaftError error = 2;
  }
}

message ReadOk {
  uint64 seq = 1;
  optional bytes value = 2; // unset = key doesn't currently exist
}

message GetKeysRequest {
  // Where to start, inclusive. Empty starts at the first key there is.
  // A caller continuing a walk passes the last key it saw with a single
  // zero byte appended, which is the next key there could be.
  bytes start_key = 1;
  // How many keys to return at most. 0 means the server's default (10).
  // A request for more than the server is willing to scan in one call
  // is refused rather than quietly shortened, for the same reason an
  // over-long transaction lifetime is: a caller told "yes" would
  // otherwise page as though it had a batch size it did not get.
  uint32 max_keys = 2;
  // Walk as part of this transaction: every key returned joins its read
  // set, exactly as Read does, and keys it has buffered writes for are
  // reflected -- a buffered write makes a key appear, a buffered delete
  // makes it disappear.
  //
  // Note what this does and does not promise. Every key handed back is
  // locked, so none of them can change while the transaction lives. The
  // *range* is not locked: these are per-key locks, not predicate
  // locks, so a key that did not exist when the walk passed its
  // position can still be created by someone else. A transaction that
  // must not miss such a key cannot get that guarantee from here.
  //
  // Unset is a possibly-stale read, on the same terms as Read.
  optional bytes transaction_id = 3;
}

message GetKeysResponse {
  oneof result {
    GetKeysOk ok = 1;
    RaftError error = 2;
  }
}

message GetKeysOk {
  // In ascending order, starting at or after `start_key`. Only keys
  // that currently have a value: a deleted key is simply not here.
  repeated bytes keys = 1;
  // Whether the scan stopped because it hit `max_keys` rather than
  // because it ran out of keys. Carried explicitly instead of being
  // inferred from `keys.len() < max_keys`, which a transaction's
  // buffered deletes can make wrong -- they can shorten a batch that
  // was not the last one.
  bool has_more = 2;
}

message AddServerRequest {
  // The new server's client API address. The leader dials it for its
  // `GetConfig` to learn the rest of what the configuration needs --
  // server_id and peer API address -- straight from the server being
  // added, rather than trusting the caller to supply them correctly.
  string client_address = 1;
}

message RemoveServerRequest {
  string server_id = 1;
}

message BootstrapRequest {
  // Optional guard: if set, the node refuses unless this is its own id.
  // Bootstrapping is irreversible, so it is worth being able to say out
  // loud which node you believe you are talking to.
  string server_id = 1;
}

message ConfigChangeResponse {
  oneof result {
    bool ok = 1;
    RaftError error = 2;
    // Membership changes are administrators-only, so this carries the
    // same NOT_ADMIN a CreateUser would -- one error type for "you may
    // not do this", whichever call it was.
    AuthError auth_error = 3;
  }
}

message GetConfigRequest {}

message GetConfigResponse {
  raft5.cluster.ClusterMember identity = 1;
  repeated raft5.cluster.ClusterMember members = 2;
  // Whether this node is leading *now*: it has applied the no-op from
  // its own term, so its state reflects everything any previous leader
  // committed, and it still holds a quorum of leases, so it has not
  // been deposed without noticing. A leader that fails either says
  // false here, the same as a follower does -- including, briefly, one
  // that has just won an election and not yet applied its own no-op.
  // That is reported rather than waited for, so a client scanning for
  // the leader is never held up by a node that isn't ready; it simply
  // looks again.
  //
  // This is how a client finds the leader. It is carried on GetConfig
  // rather than a probe of its own because a client scanning for the
  // leader wants the membership from each node it asks anyway -- a
  // client seeded with one follower learns where everyone else is from
  // the same answer that tells it this node is not the one.
  bool is_leader = 3;
}

// `ttl_ms` is how long the transaction may hold its locks. A value past
// what this server is willing to grant is refused rather than quietly
// shortened: a caller told "yes" to a lifetime it will not get would go
// on to act as though it had one.
message CreateTransactionRequest {
  uint64 ttl_ms = 1;
}

message CreateTransactionResponse {
  oneof result {
    bytes transaction_id = 1; // opaque; server-generated
    RaftError error = 2;
  }
}

message CommitTransactionRequest {
  bytes transaction_id = 1;
}

message CommitTransactionResponse {
  oneof result {
    // The sequence number every key in the transaction was written at --
    // one entry, so one seq for all of them. Zero for a transaction that
    // buffered no writes: there was nothing to append, so there is no
    // sequence number to name.
    uint64 seq = 1;
    RaftError error = 2;
  }
}

// Give up a transaction and release its locks. Idempotent, and content
// with an id it has never heard of: committing and then dropping is the
// ordinary path, and a client shouldn't have to know whether its drop
// raced its own commit.
message DropTransactionRequest {
  bytes transaction_id = 1;
}

message DropTransactionResponse {
  oneof result {
    bool ok = 1;
    RaftError error = 2;
  }
}

// Why an authenticated request was not served -- as distinct from the
// token itself being bad, which never reaches these RPCs.
//
// Carried in-band beside RaftError rather than as a gRPC status, for the
// same reason a lock conflict is: these are answers, not failures to
// answer, and a client that retried them would spend its whole deadline
// arriving back here. An UNAUTHENTICATED status means one specific thing
// instead -- the token was missing, forged, or expired -- and is raised
// by the node's auth layer before any handler runs.
message AuthError {
  enum Kind {
    UNSPECIFIED = 0;
    // The username or the password was wrong. Which of the two is
    // deliberately not said: naming the username as the valid half is
    // handing over half a credential.
    BAD_CREDENTIALS = 1;
    ALREADY_EXISTS = 2;
    NO_SUCH_USER = 3;
    // The caller is who they say they are, and is not an admin.
    NOT_ADMIN = 4;
    // This node was started without a signing secret, so it has no
    // accounts to consult and nothing to sign a token with.
    AUTH_DISABLED = 5;
  }
  Kind kind = 1;
  string detail = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginOk {
  string token = 1;
  // When the token stops being accepted, in seconds since the epoch.
  // Carried explicitly so that a client never has to parse a JWT to know
  // when to log in again.
  int64 expires_unix = 2;
}

message LoginResponse {
  oneof result {
    LoginOk ok = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  // Whether this account may itself add and remove accounts.
  bool is_admin = 3;
}

message CreateUserResponse {
  oneof result {
    // The sequence number the account record was written at.
    uint64 seq = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}

message DeleteUserRequest {
  string username = 1;
}

message DeleteUserResponse {
  oneof result {
    uint64 seq = 1;
    RaftError error = 2;
    AuthError auth_error = 3;
  }
}
