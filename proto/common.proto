syntax = "proto3";

package raft5.common;

// What a log entry does. Only PUT and DELETE carry key/value state
// machine data; the rest are Raft protocol entries that occupy a
// sequence number (so they participate in log matching and commitment
// like anything else) but never reach the key/value state in `latest`.
enum EntryKind {
  PUT = 0;    // `key` set, `value` set
  DELETE = 1; // `key` set, `value` unset
  NOOP = 2;   // neither set -- see raft::leader::Leader::new
  // `value` holds an encoded raft5.cluster.ClusterConfig, `key` unset.
  // Unlike the others this takes effect on append, not on commit --
  // see storage::RaftLog::current_config.
  CONFIG = 3;
}

// Mirrors storage::LogEntry: a single entry at a given sequence number
// and term. `kind` must survive replication -- a follower re-appends
// these into its own log verbatim, so dropping it would flatten every
// replicated entry into a PUT.
message LogEntry {
  uint64 seq = 1;
  uint64 term = 2;
  bytes key = 3;
  optional bytes value = 4;
  EntryKind kind = 5;
}
