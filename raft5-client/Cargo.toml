[package]
name = "raft5-client"
version = "0.1.0"
edition = "2024"

[lib]
name = "raft5_client"

[[bin]]
name = "raft"
path = "src/bin/raft.rs"

[dependencies]
raft5-shared = { path = "../raft5-shared" }
tonic = { workspace = true }
tokio = { workspace = true }
log = "0.4.34"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
shell-words = "1.1.1"
rpassword = "7.5.4"

[dev-dependencies]
raft5-server = { path = "../raft5-server" }
tokio-util = "0.7.19"
